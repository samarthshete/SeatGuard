services:
  # TicketBlitz API (Fastify + Prisma + Socket.io)
  # The API uses only PostgreSQL — no Redis or Kafka.
  #
  # No database is created here (Render free tier allows only one free Postgres).
  # Provide DATABASE_URL manually in the dashboard, pointing at any Postgres.
  # When sharing a database with another app, append a dedicated schema so the
  # tables can't collide, e.g.  ...&schema=seatguard
  - type: web
    name: ticket-blitz-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Set in the Render dashboard. Reuse an existing Postgres + a dedicated
      # schema, e.g. postgresql://USER:PASS@HOST/DB?schema=seatguard
      - key: DATABASE_URL
        sync: false
      # Set in the Render dashboard to your deployed frontend (Vercel) URL.
      - key: FRONTEND_URL
        sync: false
